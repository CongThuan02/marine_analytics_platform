flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  
  # Android specific
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  
  # iOS specific
  remove_alpha_ios: true
  
  # Web (optional)
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#2E7D32"
